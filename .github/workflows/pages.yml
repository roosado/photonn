name: Deploy site to GitHub Pages

# Publishes the self-contained site/ folder. Using the GitHub Actions Pages source
# (rather than "deploy from a branch") lets us serve an arbitrary subfolder -- the
# branch-deploy UI only offers / (root) or /docs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site            # serve the contents of site/ (site/index.html -> root)
      - id: deployment
        uses: actions/deploy-pages@v4
