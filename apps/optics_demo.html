<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photonn &mdash; what separation buys</title>
<style>
  :root{color-scheme:light dark;}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:#fff;color:#1b1f24;}
  @media (prefers-color-scheme:dark){body{background:#0d1117;color:#e6eaf0;}}
  .wrap{max-width:880px;margin:0 auto;padding:32px 22px 56px;}
  h1{font-size:1.5rem;margin:0 0 6px;}
  .sub{color:#5a6472;margin:0 0 22px;}
  @media (prefers-color-scheme:dark){.sub{color:#9aa6b5;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>What separation buys</h1>
  <p class="sub">The diffractive network is capacity-limited, not data-limited. Its remaining
  levers are optical &mdash; and the first one is simply how far apart the phase masks sit.</p>
  <div id="optics"></div>
</div>
<script>
/*
 * optics_sweep.js -- measured accuracies from the Phase-2 optics sweep.
 *
 * GENERATED by apps/sweep_report.py from exports/sweep/optics_sweep.json --
 * do not edit by hand. Committed on purpose: exports/ is gitignored, so this
 * is the repo's only record of what the sweep measured, and the only way
 * apps/web/optics.js has data in a fresh clone.
 *
 * Accuracies are the reduced ranking protocol (see .protocol), NOT the
 * 60k x 40 epoch deliverable number.
 */
var OPTICS_SWEEP = {
  "grid": 128,
  "dx": 8e-06,
  "wavelength": 5.32e-07,
  "input_lo": 32,
  "input_hi": 95,
  "required_px": 74.0,
  "z_crit_mm": 15.398496240601501,
  "floor_acc": 0.12425,
  "protocol": {
    "epochs": 12,
    "n_train": 20000,
    "n_val": 4000,
    "seed": 20260724,
    "split_seed": 20260806
  },
  "points": [
    {
      "z_mm": 1.0,
      "layers": 5,
      "acc": 0.47975,
      "reach_total": 24.9375,
      "reach_hop": 4.15625,
      "params": 81920,
      "wrap_logit": 6.263109243207289e-05,
      "wrap_plane": 0.003121750793055102
    },
    {
      "z_mm": 2.0,
      "layers": 5,
      "acc": 0.701,
      "reach_total": 49.875,
      "reach_hop": 8.3125,
      "params": 81920,
      "wrap_logit": 0.00016085614969339572,
      "wrap_plane": 0.01772220154056641
    },
    {
      "z_mm": 3.0,
      "layers": 5,
      "acc": 0.77125,
      "reach_total": 74.81250000000001,
      "reach_hop": 12.468750000000002,
      "params": 81920,
      "wrap_logit": 0.0006182455041225533,
      "wrap_plane": 0.05826679204934352
    },
    {
      "z_mm": 5.0,
      "layers": 5,
      "acc": 0.79025,
      "reach_total": 124.68750000000003,
      "reach_hop": 20.781250000000004,
      "params": 81920,
      "wrap_logit": 0.008980720980387996,
      "wrap_plane": 0.14768468309334787
    },
    {
      "z_mm": 8.0,
      "layers": 5,
      "acc": 0.78675,
      "reach_total": 199.5,
      "reach_hop": 33.25,
      "params": 81920,
      "wrap_logit": 0.04157553207580774,
      "wrap_plane": 0.2970950003940216
    },
    {
      "z_mm": 12.0,
      "layers": 5,
      "acc": 0.77425,
      "reach_total": 299.25000000000006,
      "reach_hop": 49.87500000000001,
      "params": 81920,
      "wrap_logit": 0.1237472831848973,
      "wrap_plane": 0.4820765806336387
    }
  ]
};
if (typeof module !== 'undefined') { module.exports = OPTICS_SWEEP; }

</script>
<script>
/*
 * optics.js -- what separation buys, and where it stops buying.
 *
 * One slider (inter-plane separation z) and two linked panels:
 *
 *  1. "Reach" -- the entrance window, and the cone one edge input pixel throws
 *     over all six hops. Below the connectivity bound the cone stops short of the
 *     far detector: part of the input is *physically* unable to influence part of
 *     the readout, whatever the masks were trained to. The cone turns red there.
 *
 *  2. "What it scores" -- the measured accuracy curve against total reach, with
 *     the operating point tracking the slider, the pure-diffraction floor drawn
 *     in, and configurations whose simulation is wrap-contaminated ringed.
 *
 * The geometry is recomputed live from reach = z*lambda/(2*dx^2), the same closed
 * form as photonn.propagate.diffraction_reach_px -- so no weights are loaded and
 * nothing is fetched. The accuracies are measured points from
 * window.OPTICS_SWEEP (optics_sweep.js, generated by apps/sweep_report.py); they
 * are the reduced ranking protocol, not the deliverable number, and the widget
 * says so rather than letting the axis imply otherwise.
 *
 * Usage:  window.PhotonnOptics.mount(containerElement, opts)
 * opts (all optional): { zMm: <initial separation in mm> }
 */
(function () {
  "use strict";

  const DATA = (typeof window !== "undefined" && window.OPTICS_SWEEP)
    ? window.OPTICS_SWEEP
    : (typeof require !== "undefined" ? require("./optics_sweep.js") : null);

  const STYLE_ID = "po-style";
  const CSS = `
.po-root{--pe-fg:#1b1f24;--pe-muted:#5a6472;--pe-panel:#f4f6f9;--pe-border:#d7dde5;
  --pe-accent:#3b6ea5;--pe-ok:#3f8f4e;--pe-warn:#c14a3d;--po-mix:#c9701f;
  color:var(--pe-fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;flex-direction:column;gap:16px;}
@media (prefers-color-scheme:dark){.po-root{--pe-fg:#e6eaf0;--pe-muted:#9aa6b5;
  --pe-panel:#1c2128;--pe-border:#30363d;--pe-accent:#6ea8e0;--pe-ok:#5cc06e;
  --pe-warn:#e0705f;--po-mix:#f2994a;}}
.po-box{background:var(--pe-panel);border:1px solid var(--pe-border);border-radius:10px;
  padding:14px 16px;}
.po-box h4{margin:0 0 3px;font-size:12px;color:var(--pe-muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;}
.po-box .sub{margin:0 0 12px;font-size:13px;color:var(--pe-muted);max-width:70ch;}
.po-canvas{display:block;width:100%;}
.po-slider{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 14px;}
.po-slider input[type=range]{flex:1 1 260px;accent-color:var(--pe-accent);min-width:180px;}
.po-slider .lab{font-size:12px;font-weight:600;color:var(--pe-muted);white-space:nowrap;}
.po-slider .val{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--pe-accent);min-width:7.5em;}
.po-readout{min-height:3.2em;margin:10px 0 0;font-size:13px;color:var(--pe-fg);
  border-top:1px solid var(--pe-border);padding-top:10px;}
.po-readout b{color:var(--pe-accent);}
.po-readout .bad{color:var(--pe-warn);font-weight:600;}
.po-readout .ok{color:var(--pe-ok);font-weight:600;}
.po-readout .warn{color:var(--po-mix);font-weight:600;}
.po-note{font-size:11.5px;color:var(--pe-muted);margin:8px 0 0;}
`;

  function injectStyle() {
    if (typeof document === "undefined" || document.getElementById(STYLE_ID)) return;
    const el = document.createElement("style");
    el.id = STYLE_ID;
    el.textContent = CSS;
    document.head.appendChild(el);
  }

  function fitCanvas(canvas, cssW, cssH) {
    const dpr = window.devicePixelRatio || 1;
    canvas.style.height = cssH + "px";
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    const ctx = canvas.getContext("2d");
    // Bake the dpr into the transform once, as analogy.js does, so every draw
    // below can work in CSS pixels and stay sharp on high-DPI screens.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    return ctx;
  }

  function palette(root) {
    const cs = getComputedStyle(root);
    const get = (name, fallback) => (cs.getPropertyValue(name).trim() || fallback);
    return {
      fg: get("--pe-fg", "#1b1f24"),
      muted: get("--pe-muted", "#5a6472"),
      border: get("--pe-border", "#d7dde5"),
      accent: get("--pe-accent", "#3b6ea5"),
      mix: get("--po-mix", "#c9701f"),
      warn: get("--pe-warn", "#c14a3d"),
      ok: get("--pe-ok", "#3f8f4e"),
    };
  }

  function label(ctx, text, x, y, color, size, align, weight) {
    ctx.fillStyle = color;
    ctx.font = `${weight || 400} ${size || 11}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    ctx.textAlign = align || "left";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x, y);
  }

  /** reach per hop in px -- the closed form of propagate.diffraction_reach_px. */
  function reachPerHop(zMm, d) {
    return (zMm * 1e-3) * d.wavelength / (2 * d.dx * d.dx);
  }

  function mount(container, opts) {
    opts = opts || {};
    if (!DATA) throw new Error("optics.js: OPTICS_SWEEP data bundle not loaded.");
    injectStyle();

    const d = DATA;
    const pts = (d.points || []).slice().sort((a, b) => a.z_mm - b.z_mm);
    const hops = (pts.length ? pts[0].layers : 5) + 1;
    const zMin = pts.length ? Math.min(1, pts[0].z_mm) : 1;
    const zMax = pts.length ? Math.max(12, pts[pts.length - 1].z_mm) : 12;

    const root = document.createElement("div");
    root.className = "po-root";
    root.innerHTML = `
      <div class="po-box">
        <div class="po-slider">
          <span class="lab">separation z</span>
          <input type="range" min="${zMin}" max="${zMax}" step="0.1" value="${opts.zMm || 3}">
          <span class="val"></span>
        </div>
        <canvas class="po-canvas po-cone"></canvas>
        <p class="po-readout"></p>
      </div>
      <div class="po-box">
        <h4>What it scores</h4>
        <p class="sub">Measured validation accuracy against total reach. Ringed points
        are configurations whose <em>simulation</em> is wrap-contaminated, not designs
        that were tried and found wanting.</p>
        <canvas class="po-canvas po-curve"></canvas>
        <p class="po-note"></p>
      </div>`;
    container.appendChild(root);

    const slider = root.querySelector("input[type=range]");
    const valEl = root.querySelector(".val");
    const readEl = root.querySelector(".po-readout");
    const noteEl = root.querySelector(".po-note");
    const coneCv = root.querySelector(".po-cone");
    const curveCv = root.querySelector(".po-curve");

    noteEl.textContent = d.protocol
      ? `Accuracies: ${d.protocol.n_train} train / ${d.protocol.n_val} validation, `
        + `${d.protocol.epochs} epochs, seed ${d.protocol.seed}. A ranking protocol -- `
        + `deliberately shorter than the 60k x 40 epoch deliverable run, so these `
        + `numbers rank configurations and are not comparable to the headline accuracy.`
      : "";

    function nearestPoint(zMm) {
      let best = null, bestD = Infinity;
      for (const p of pts) {
        const dd = Math.abs(p.z_mm - zMm);
        if (dd < bestD) { bestD = dd; best = p; }
      }
      return { point: best, exact: bestD < 1e-6 };
    }

    function drawCone(zMm) {
      const p = palette(root);
      const w = coneCv.clientWidth || 640, h = 210;
      const ctx = fitCanvas(coneCv, w, h);
      const padL = 14, padR = 14;
      const span = w - padL - padR;
      const px = (i) => padL + (i / d.grid) * span;

      const yIn = 34, yOut = h - 44;
      const reach = reachPerHop(zMm, d) * hops;
      const covered = reach >= d.required_px;

      // planes
      ctx.strokeStyle = p.border; ctx.lineWidth = 1;
      [yIn, yOut].forEach((y) => {
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      });
      label(ctx, "input plane", padL, yIn - 16, p.muted, 10.5);
      label(ctx, "detector plane", padL, yOut + 18, p.muted, 10.5);

      // entrance window
      ctx.fillStyle = p.muted; ctx.globalAlpha = 0.28;
      ctx.fillRect(px(d.input_lo), yIn - 6, px(d.input_hi) - px(d.input_lo), 12);
      ctx.globalAlpha = 1;

      // The cone from the window's right edge. The worst case runs leftward: the
      // input pixel at px 95 has to reach the detector pixel at px 21, 74 px away
      // (docs/phase3_mesh.md), so that is the edge the cone is judged against.
      const tip = Math.min(d.input_hi + reach, d.grid);
      const far = Math.max(d.input_hi - reach, 0);
      const col = covered ? p.accent : p.warn;
      ctx.fillStyle = col; ctx.globalAlpha = 0.18;
      ctx.beginPath();
      ctx.moveTo(px(d.input_hi), yIn);
      ctx.lineTo(px(tip), yOut);
      ctx.lineTo(px(far), yOut);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = col; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(px(d.input_hi), yIn); ctx.lineTo(px(far), yOut); ctx.stroke();

      // the requirement: the farthest detector pixel it has to illuminate
      const need = d.input_hi - d.required_px;
      ctx.strokeStyle = p.fg; ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(px(need), yIn); ctx.lineTo(px(need), yOut + 8); ctx.stroke();
      ctx.setLineDash([]);
      label(ctx, "farthest detector", px(need) + 6, yIn + 14, p.fg, 10.5, "left", 600);
      label(ctx, `${reach.toFixed(1)} px reach`, w - padR, yOut - 14, col, 11.5, "right", 700);
    }

    function drawCurve(zMm) {
      const p = palette(root);
      const w = curveCv.clientWidth || 640, h = 240;
      const ctx = fitCanvas(curveCv, w, h);
      if (!pts.length) return;

      const padL = 46, padR = 16, padT = 16, padB = 34;
      const xs = pts.map((q) => q.reach_total);
      const ys = pts.map((q) => q.acc);
      const x0 = 0, x1 = Math.max.apply(null, xs) * 1.06;
      const y0 = Math.min(0.08, Math.min.apply(null, ys) - 0.05);
      const y1 = Math.max.apply(null, ys) + 0.06;
      const X = (v) => padL + (v - x0) / (x1 - x0) * (w - padL - padR);
      const Y = (v) => h - padB - (v - y0) / (y1 - y0) * (h - padT - padB);

      // under-connected region
      ctx.fillStyle = p.warn; ctx.globalAlpha = 0.07;
      ctx.fillRect(X(x0), padT, X(d.required_px) - X(x0), h - padT - padB);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = p.fg; ctx.lineWidth = 1.1; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(X(d.required_px), padT); ctx.lineTo(X(d.required_px), h - padB); ctx.stroke();
      ctx.setLineDash([]);
      // Sits low: the interesting points crowd the top of the plot.
      label(ctx, "connectivity bound", X(d.required_px) - 6, h - padB - 12, p.fg, 10, "right", 600);

      // axes
      ctx.strokeStyle = p.border; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, h - padB);
      ctx.lineTo(w - padR, h - padB); ctx.stroke();
      label(ctx, "total reach (px)", (w + padL) / 2, h - 9, p.muted, 10.5, "center");
      ctx.save(); ctx.translate(13, (h - padB + padT) / 2); ctx.rotate(-Math.PI / 2);
      label(ctx, "accuracy", 0, 0, p.muted, 10.5, "center"); ctx.restore();
      [y0, (y0 + y1) / 2, y1].forEach((v) => {
        label(ctx, v.toFixed(2), padL - 6, Y(v), p.muted, 9.5, "right");
      });
      for (let t = 0; t <= x1; t += 100) {
        if (t < x0) continue;
        ctx.strokeStyle = p.border; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(X(t), h - padB); ctx.lineTo(X(t), h - padB + 4); ctx.stroke();
        label(ctx, String(t), X(t), h - padB + 13, p.muted, 9.5, "center");
      }

      if (d.floor_acc != null) {
        ctx.strokeStyle = p.muted; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
        ctx.beginPath(); ctx.moveTo(padL, Y(d.floor_acc)); ctx.lineTo(w - padR, Y(d.floor_acc)); ctx.stroke();
        ctx.setLineDash([]);
        label(ctx, `pure diffraction, 0 parameters (${d.floor_acc.toFixed(3)})`,
              w - padR, Y(d.floor_acc) - 9, p.muted, 9.5, "right");
      }

      // the measured curve
      ctx.strokeStyle = p.accent; ctx.lineWidth = 2;
      ctx.beginPath();
      pts.forEach((q, i) => (i ? ctx.lineTo(X(q.reach_total), Y(q.acc)) : ctx.moveTo(X(q.reach_total), Y(q.acc))));
      ctx.stroke();

      const near = nearestPoint(zMm).point;
      pts.forEach((q) => {
        ctx.fillStyle = q === near ? p.accent : p.border;
        ctx.strokeStyle = p.accent; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(X(q.reach_total), Y(q.acc), q === near ? 6 : 4, 0, 2 * Math.PI);
        ctx.fill(); ctx.stroke();
        if (q.wrap_logit != null && q.wrap_logit > 0.02) {
          ctx.strokeStyle = p.mix; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(X(q.reach_total), Y(q.acc), 10, 0, 2 * Math.PI); ctx.stroke();
        }
        label(ctx, `${q.z_mm}mm`, X(q.reach_total), Y(q.acc) - 16, p.muted, 9.5, "center");
      });
    }

    function update() {
      const zMm = parseFloat(slider.value);
      const reach = reachPerHop(zMm, d);
      const total = reach * hops;
      const near = nearestPoint(zMm);
      const covered = total >= d.required_px;

      valEl.textContent = zMm.toFixed(1) + " mm";

      let txt = `<b>${reach.toFixed(2)} px</b> per hop, <b>${total.toFixed(1)} px</b> over `
              + `${hops} hops. `;
      txt += covered
        ? `<span class="ok">Every input pixel can reach every detector</span> `
          + `(needs ${d.required_px} px). `
        : `<span class="bad">Under-connected</span> &mdash; ${(d.required_px - total).toFixed(1)} px `
          + `short, so part of the input cannot influence part of the readout at all. `;
      if (near.point) {
        txt += near.exact
          ? `Measured accuracy <b>${near.point.acc.toFixed(4)}</b>.`
          : `Nearest measured configuration: ${near.point.z_mm} mm, `
            + `accuracy ${near.point.acc.toFixed(4)}.`;
        if (near.exact && near.point.wrap_logit != null && near.point.wrap_logit > 0.02) {
          txt += ` <span class="warn">Wrap-contaminated</span>: the finite grid mis-states `
               + `the detector readings by ${(near.point.wrap_logit * 100).toFixed(1)}% here.`;
        }
      }
      readEl.innerHTML = txt;

      drawCone(zMm);
      drawCurve(zMm);
    }

    slider.addEventListener("input", update);
    if (window.matchMedia) {
      const mq = window.matchMedia("(prefers-color-scheme:dark)");
      const onTheme = () => update();
      if (mq.addEventListener) mq.addEventListener("change", onTheme);
      else if (mq.addListener) mq.addListener(onTheme);
    }
    window.addEventListener("resize", update);
    update();
    return { update };
  }

  const API = { mount, reachPerHop };
  if (typeof window !== "undefined") window.PhotonnOptics = API;
  if (typeof module !== "undefined") module.exports = API;
})();

</script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    window.PhotonnOptics.mount(document.getElementById('optics'), {"zMm": 3});
  });
</script>
</body>
</html>
